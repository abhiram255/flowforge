# Prod web container: static SPA only.
#
# /api and /socket.io are routed by the edge (Traefik) directly to the API
# replicas, so this config deliberately does NOT proxy them — an nginx upstream
# would resolve `api` once at startup and pin all traffic to a single replica.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Liveness for the container healthcheck
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
