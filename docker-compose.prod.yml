# ---------------------------------------------------------------------------
# FlowForge production topology (single host, Docker Compose).
#
#   docker compose -f docker-compose.prod.yml up -d --build \
#     --scale api=3 --scale worker=1
#
# - Traefik is the edge: health-checked load balancing across api replicas,
#   retry middleware, sticky cookie for Socket.IO polling. Only Traefik is
#   published to the host; databases, cache and object storage are internal.
# - API replicas and workers are separate processes (PROCESS_ROLE); jobs run
#   only in the worker tier, so request serving never competes with job CPU.
# - Attachments live in the bundled S3-compatible store (SeaweedFS), shared by
#   every replica. Point S3_* at AWS/R2/any S3 service instead if preferred.
# - MongoDB runs as a 3-node replica set (rs0) for failover and secondary reads
#   (analytics only; auth/tenancy/task reads stay on the primary).
# - MONGODB_AUTO_INDEX=false: indexes are built once by the ensure-indexes
#   one-shot, so a large collection never triggers a surprise build at boot.
#
# Configuration: copy .env.prod.example to .env (or export the variables).
# TLS/ACME is opt-in — see .env.prod.example and README for the two-line wiring.
# ---------------------------------------------------------------------------
name: flowforge-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-api-env: &api-env
  NODE_ENV: production
  PORT: '4000'
  MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/flowforge?replicaSet=rs0
  # 50 connections x API replicas must stay under the server's connection budget.
  MONGODB_MAX_POOL_SIZE: '50'
  MONGODB_AUTO_INDEX: 'false'
  MONGODB_ANALYTICS_READ_PREFERENCE: secondaryPreferred
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-CHANGE-ME-production-secret-at-least-32-chars}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  COOKIE_SECURE: 'true'
  APP_URL: ${APP_URL:-http://localhost:8080}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
  S3_BUCKET: ${S3_BUCKET:-flowforge}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-flowforge}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-flowforge-secret}
  S3_FORCE_PATH_STYLE: 'true'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Per-client API budget (shared across replicas via Redis). Raise it for
  # load tests / trusted internal clients; keep it sane for public traffic.
  API_RATE_LIMIT_PER_MIN: ${API_RATE_LIMIT_PER_MIN:-600}
  SEED_ON_START: 'false'

services:
  traefik:
    # v3.6+ is required for Docker Engine 29+ (API version auto-negotiation;
    # older clients still speak 1.24 and get rejected with a bare 400).
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --ping=true
      - --accesslog=true
      - --log.level=INFO
    ports:
      - '80:80'
      # Enable for direct TLS termination (see .env.prod.example for ACME flags):
      # - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    logging: *default-logging

  api:
    image: ${API_IMAGE:-flowforge-api:local}
    build: *api-build
    restart: unless-stopped
    mem_limit: 1g
    # Docker kills the process this many seconds after SIGTERM; the app drains
    # in-flight requests for DRAIN_TIMEOUT_MS (10s), so this must stay larger.
    stop_grace_period: 20s
    environment:
      <<: *api-env
      PROCESS_ROLE: api
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      ensure-indexes:
        condition: service_completed_successfully
      ensure-bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - edge
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.ff-api.rule=PathPrefix(`/api`) || PathPrefix(`/socket.io`)
      - traefik.http.routers.ff-api.entrypoints=web
      - traefik.http.routers.ff-api.priority=100
      - traefik.http.routers.ff-api.service=ff-api
      - traefik.http.routers.ff-api.middlewares=ff-retry
      - traefik.http.services.ff-api.loadbalancer.server.port=4000
      # Session affinity for the Socket.IO HTTP-polling fallback; websocket
      # upgrade requests are handled by the same pool.
      - traefik.http.services.ff-api.loadbalancer.sticky.cookie=true
      - traefik.http.services.ff-api.loadbalancer.healthcheck.path=/api/v1/health/ready
      - traefik.http.services.ff-api.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.ff-api.loadbalancer.healthcheck.timeout=3s
      - traefik.http.middlewares.ff-retry.retry.attempts=2
    logging: *default-logging

  worker:
    image: ${API_IMAGE:-flowforge-api:local}
    build: *api-build
    restart: unless-stopped
    mem_limit: 512m
    # worker.close() waits for active jobs before exiting.
    stop_grace_period: 30s
    environment:
      <<: *api-env
      PROCESS_ROLE: worker
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

  web:
    image: ${WEB_IMAGE:-flowforge-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - edge
    volumes:
      # Static-only nginx: /api and /socket.io are routed by Traefik directly to
      # the API replicas (a proxying nginx would pin traffic to one replica).
      - ./infra/docker/web-nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.ff-web.rule=PathPrefix(`/`)
      - traefik.http.routers.ff-web.entrypoints=web
      - traefik.http.routers.ff-web.priority=1
      - traefik.http.routers.ff-web.service=ff-web
      - traefik.http.services.ff-web.loadbalancer.server.port=80
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  mongo1:
    image: mongo:8
    restart: unless-stopped
    # Bounded WiredTiger cache — three nodes on one host must share memory.
    command:
      ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--wiredTigerCacheSizeGB', '0.25']
    volumes:
      - mongo1-data:/data/db
    networks:
      - internal
    mem_limit: 1g
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

  mongo2:
    image: mongo:8
    restart: unless-stopped
    command:
      ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--wiredTigerCacheSizeGB', '0.25']
    volumes:
      - mongo2-data:/data/db
    networks:
      - internal
    mem_limit: 1g
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

  mongo3:
    image: mongo:8
    restart: unless-stopped
    command:
      ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--wiredTigerCacheSizeGB', '0.25']
    volumes:
      - mongo3-data:/data/db
    networks:
      - internal
    mem_limit: 1g
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

  # One-shot: initiate the replica set (idempotent) and wait for a primary.
  mongo-init:
    image: mongo:8
    restart: 'no'
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    networks:
      - internal
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mongosh --host mongo1:27017 --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({ _id: "rs0", members: [ { _id: 0, host: "mongo1:27017", priority: 2 }, { _id: 1, host: "mongo2:27017" }, { _id: 2, host: "mongo3:27017" } ] }) }'
        until mongosh --host mongo1:27017 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks:
      - internal
    mem_limit: 256m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ['server', '-s3', '-s3.config=/etc/seaweedfs/s3.json', '-dir=/data']
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - internal
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8333']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # One-shot: create the attachments bucket (idempotent).
  ensure-bucket:
    image: ${API_IMAGE:-flowforge-api:local}
    build: *api-build
    restart: 'no'
    environment:
      <<: *api-env
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks:
      - internal
    command: ['node', 'apps/api/dist/scripts/ensure-bucket.js']
    logging: *default-logging

  # One-shot: build all indexes (non-destructive; autoIndex is off).
  ensure-indexes:
    image: ${API_IMAGE:-flowforge-api:local}
    build: *api-build
    restart: 'no'
    environment:
      <<: *api-env
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - internal
    command: ['node', 'apps/api/dist/scripts/ensure-indexes.js']
    logging: *default-logging

  # Opt-in dashboards:  docker compose -f docker-compose.prod.yml --profile observability up -d
  prometheus:
    image: prom/prometheus:latest
    profiles: ['observability']
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - ./infra/monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    networks:
      - internal
      - edge
    mem_limit: 512m
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    profiles: ['observability']
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/flowforge.json:ro
    ports:
      - '3000:3000'
    networks:
      - edge
    mem_limit: 512m
    logging: *default-logging

networks:
  # Published edge (Traefik <-> web/api only).
  edge:
  # Everything internal: databases, cache, object storage, workers.
  internal:

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
  redis-data:
  seaweedfs-data:
