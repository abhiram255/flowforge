name: Deploy

# Builds and publishes container images to GHCR on every main push, then
# deploys over SSH *only when the DEPLOY_* repository secrets are configured.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: images
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Explain skip
        if: env.DEPLOY_HOST == ''
        run: |
          echo "DEPLOY_HOST is not configured — images were published but no deploy ran."
          echo "Set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (and DEPLOY_PATH) to enable."
      - name: Deploy
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Pin this release's images (SHA tags, never :latest), then scale on every up —
            # a missing --scale silently drops the deployment back to one replica.
            export API_IMAGE="${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}"
            export WEB_IMAGE="${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}"
            docker compose -f docker-compose.prod.yml pull api worker web
            docker compose -f docker-compose.prod.yml up -d --remove-orphans \
              --scale api=${API_REPLICAS:-2} --scale worker=${WORKER_REPLICAS:-1}
            docker image prune -f
