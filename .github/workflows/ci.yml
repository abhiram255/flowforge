name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and builds
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/flowforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Start SeaweedFS for the S3 driver integration test
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json" \
            chrislusf/seaweedfs server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8333/ && break
            sleep 1
          done
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: API integration tests
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:8333
          S3_TEST_ACCESS_KEY_ID: flowforge
          S3_TEST_SECRET_ACCESS_KEY: flowforge-secret
        run: npm run test -w @flowforge/api
      - name: Web unit tests
        run: npm run test -w @flowforge/web
      - name: Build API
        run: npm run build -w @flowforge/api
      - name: Build web
        run: npm run build -w @flowforge/web

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: verify
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run E2E suite (boots API with a seeded e2e database)
        run: npm run e2e -w @flowforge/web
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build images
        run: docker compose build
